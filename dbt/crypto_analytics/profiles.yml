crypto_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'postgres') }}"
      user: "{{ env_var('WAREHOUSE_USER', 'crypto_user') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'crypto_pass') }}"
      port: 5432
      dbname: "{{ env_var('WAREHOUSE_DB', 'crypto_warehouse') }}"
      schema: public
      threads: 4
