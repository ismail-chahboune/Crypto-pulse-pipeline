version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: crypto_price_snapshots
        description: Raw daily market-data snapshots landed by the Airflow ingestion task.
        columns:
          - name: coin_id
            tests:
              - not_null
          - name: snapshot_date
            tests:
              - not_null

models:
  - name: stg_crypto_prices
    description: Cleaned, typed view of the raw crypto price snapshots.
    columns:
      - name: coin_id
        description: CoinGecko's unique identifier for the coin.
        tests:
          - not_null
      - name: symbol
        description: Ticker symbol (e.g. BTC, ETH), upper-cased.
        tests:
          - not_null
      - name: snapshot_date
        description: The calendar date this snapshot was captured on.
        tests:
          - not_null
      - name: price_usd
        description: Price in USD at snapshot time.
        tests:
          - not_null
